version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: petropulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-petropulse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petropulse-network

  # 2. Standalone Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petropulse-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-petropulse}
      CORS_ORIGIN: "http://localhost:3000,http://localhost:80"
      JWT_SECRET: ${JWT_SECRET:-petropulse_production_secret_key_change_me}
      EOD_CLOSE_TIME: "23:59:00"
      DEFAULT_TIMEZONE: "Asia/Kolkata"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - petropulse-network

  # 3. Standalone Frontend Web Application Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: petropulse-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: "http://localhost:5000"
    ports:
      - "3000:80"
    networks:
      - petropulse-network

networks:
  petropulse-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
