name: Sync to GitLab

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync-to-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT || 'abdulaskar45/agfuel' }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is missing or empty! Please add GITLAB_TOKEN in GitHub repository: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Syncing branches and tags to GitLab: $GITLAB_PROJECT..."
          git push --prune --force "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git" "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
          echo "Successfully synced to GitLab!"
