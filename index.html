<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>AG Fuels ERP</title>
    <link rel="icon" type="image/png" href="/frontend/public/logo.png" />
    <meta name="description" content="AG Fuels ERP - Enterprise forecourt management, multi-station petrol bunk monitoring, automated tank gauging, nozzle totalizers, staff shift settlement, and daily sales reconciliation." />
    <meta property="og:title" content="AG Fuels ERP - Multi-Station Fuel Management" />
    <meta property="og:description" content="AG Fuels ERP - Enterprise forecourt management, multi-station petrol bunk monitoring, automated tank gauging, nozzle totalizers, staff shift settlement, and daily sales reconciliation." />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('petropulse_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/src/main.tsx"></script>
  </body>
</html>
